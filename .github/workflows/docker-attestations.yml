name: Docker Build with Secure Attestations

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # The arm64 image is built under emulation
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: jonaslejon/ct-monitor
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{version}},suffix=-attested
          type=raw,value=latest-attested,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=sha

    - name: Build and push with attestations
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: mode=max
        sbom: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify attestations
      run: |
        # Verify the image was built with attestations (tags is a multi-line list, so inspect the first)
        docker buildx imagetools inspect ${{ fromJSON(steps.meta.outputs.json).tags[0] }} | head -20
