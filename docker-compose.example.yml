# Docker Compose example for CT Monitor with Elasticsearch
# Copy this file to docker-compose.yml and customize as needed

services:
  # Elasticsearch service for storing CT data
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: ct-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - ct-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # CT Monitor service
  ct-monitor:
    build: .
    container_name: ct-monitor
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_USER=elastic
      - ES_PASSWORD=  # Set your password here
    volumes:
      - ct_state:/data  # --state-file lives here; a named volume keeps /data writable by the container user
      - ./config:/app/config  # Optional: for configuration files
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ct-network
    # SIGTERM drains the queues before exit; give it more than CT_DRAIN_TIMEOUT (150 s)
    stop_grace_period: 3m
    # Example command for continuous, gap-free monitoring to Elasticsearch that resumes after a restart
    command: ["--es-output", "-f", "-n", "1000", "-p", "30", "--new-fetcher-logs", "all", "--state-file", "/data/state.json"]
    # Alternative: run with timeout for batch processing
    # command: ["--es-output", "--timeout", "60", "-n", "5000"]

  # Optional: Kibana for data visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: ct-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ct-network

volumes:
  elasticsearch_data:
    driver: local
  ct_state:
    driver: local

networks:
  ct-network:
    driver: bridge